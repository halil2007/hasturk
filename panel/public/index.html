<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <title>Satış Paneli</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside class="side">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span>Satış Paneli</span></div>
      <nav class="nav" aria-label="Ana menü"></nav>
      <div class="side-foot">
        <button class="btn ghost sm" data-act="sync" title="Tüm kanalları şimdi senkronla"><i class="ico ico-sync"></i><span>Senkronla</span></button>
        <div class="sync-state muted small"></div>
      </div>
    </aside>
    <header class="top">
      <h1 class="top-title">Özet</h1>
      <button class="icon-btn" data-act="sync" aria-label="Senkronla"><i class="ico ico-sync"></i></button>
      <a class="icon-btn" href="#/ayarlar" aria-label="Ayarlar"><i class="ico ico-gear"></i></a>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Alt menü"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print" aria-hidden="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
