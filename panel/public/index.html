<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1c35">
  <title>Hastürk CRM</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="side">
    <a class="brand-card" href="#/" aria-label="Ana sayfa"><img data-logo src="logo.webp" alt="Logo"><img class="brand-mini" src="icon.svg" alt=""></a>
    <button class="side-toggle" data-act="side" aria-label="Menüyü daralt" title="Menüyü daralt / genişlet"><i class="ico ico-back"></i></button>
    <div class="brand-title" data-company></div>
    <nav class="nav" data-nav aria-label="Ana menü"></nav>
    <div class="side-foot">
      <nav class="nav" data-nav-foot></nav>
      <a class="status-box" href="#/entegrasyonlar" data-status style="text-decoration:none"><span class="led"></span><div><b>Kanallar</b><span>yükleniyor…</span></div></a>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn d-only" data-act="side" aria-label="Menüyü daralt / genişlet" title="Menüyü daralt / genişlet"><i class="ico ico-menu"></i></button>
      <img class="m-logo" data-logo src="logo.webp" alt="">
      <div class="page-head"><h1 data-title>Genel Bakış</h1><div class="sub" data-sub></div></div>
      <label class="search"><i class="ico ico-search"></i><input class="input" type="search" placeholder="Sipariş, ürün veya SKU ara" data-global-search></label>
      <button class="icon-btn m-hide" data-act="sync" aria-label="Senkronla" title="Tüm kanalları şimdi senkronla"><i class="ico ico-sync"></i></button>
      <button class="icon-btn m-show" data-act="find" aria-label="Ara"><i class="ico ico-search"></i></button>
      <button class="icon-btn m-show hide" data-page-more aria-label="Sayfa işlemleri"><i class="ico ico-dots"></i></button>
      <button class="icon-btn m-hide" data-act="help" aria-label="Yardım" title="Bu sayfa nasıl kullanılır?"><i class="ico ico-help"></i></button>
      <button class="icon-btn" data-act="bell" aria-label="Bildirimler"><i class="ico ico-bell"></i><span class="dot-red hide" data-bell-dot></span></button>
      <button class="avatar" data-act="me" aria-label="Hesap">HT</button>
      <a class="btn primary top-add" href="#/urunler/yeni"><i class="ico ico-plus"></i>Ürün Ekle</a>
    </header>
    <nav class="subtabs" data-subtabs hidden aria-label="Bölüm sekmeleri"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" data-tabbar aria-label="Alt menü"></nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print" aria-hidden="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
