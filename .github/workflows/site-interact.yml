name: Canlı site gezinme ölçümü

# Müşteri gibi gezinir (kaydırma, menü, kategori ve ürün sayfasına geçiş) ve widget sürümlerini karşılaştırır.
# Actions > "Canlı site gezinme ölçümü" > Run workflow; sonuç işin özet sayfasında.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/site-interact.mjs', '.github/workflows/site-interact.yml']

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tarayıcı kur
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Ölç
        env:
          MODES: widgetli,yeni,widgetsiz
          RUNS: 3
        run: |
          for c in $(echo "$MODES" | tr ',' '\n' | sed -n 's/^eski-//p;s/^yeni$/HEAD/p'); do git show "$c:public/pm-search.js" > "/tmp/widget-$c.js"; done
          git show HEAD:public/menu.json > /tmp/menu-HEAD.json
          node scripts/site-interact.mjs
