name: Karışım ürünü not alanı (ön kontrol)

# "Kendi Toprak Karışımını Oluştur" seçenek setine metin (not) seçeneği eklemek için ön kontrol. Varsayılan yalnız okur.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/ikas-not-alani.mjs', '.github/workflows/ikas-not-alani.yml']

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/ikas-not-alani.mjs
        env:
          IKAS_STORE: ${{ secrets.IKAS_STORE }}
          IKAS_CLIENT_ID: ${{ secrets.IKAS_CLIENT_ID }}
          IKAS_CLIENT_SECRET: ${{ secrets.IKAS_CLIENT_SECRET }}
