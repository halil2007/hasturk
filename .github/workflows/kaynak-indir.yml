name: Doğrulama kaynaklarını indir

# scripts/kaynaklar.txt içindeki resmi/akademik kaynakları indirir, metne çevirir ve docs/kaynak/ altına çalışma dalına kaydeder.
# (Geliştirme ortamı bu sitelere erişemiyor.) Mağazaya dokunmaz.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/kaynaklar.txt', '.github/workflows/kaynak-indir.yml']

permissions:
  contents: write

concurrency: kaynak-indir

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: İndir ve metne çevir
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || true
          mkdir -p docs/kaynak /tmp/k
          grep -v '^#' scripts/kaynaklar.txt | while IFS=$'\t' read -r ad url; do
            [ -z "$ad" ] && continue
            code=$(curl -sSL -m 90 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' -o "/tmp/k/$ad" -w '%{http_code} %{content_type}' "$url" || echo "000 hata")
            echo "$ad → $code ($(stat -c %s "/tmp/k/$ad" 2>/dev/null || echo 0) bayt)" | tee -a "$GITHUB_STEP_SUMMARY"
            if head -c 5 "/tmp/k/$ad" | grep -q '%PDF'; then
              pdftotext -layout "/tmp/k/$ad" "docs/kaynak/$ad.txt"
            elif [ -s "/tmp/k/$ad" ]; then
              python3 -c "import sys,html,re;t=open(sys.argv[1],encoding='utf-8',errors='replace').read();t=re.sub(r'(?is)<(script|style).*?</\1>','',t);t=re.sub(r'(?s)<br\s*/?>|</(p|div|tr|li|h\d)>','\n',t);t=re.sub(r'<[^>]+>',' ',t);t=html.unescape(t);print(re.sub(r'[ \t]+',' ',re.sub(r'\n\s*\n+','\n\n',t)))" "/tmp/k/$ad" > "docs/kaynak/$ad.txt"
            fi
            [ -f "docs/kaynak/$ad.txt" ] && sed -i "1i # Kaynak: $url" "docs/kaynak/$ad.txt"
          done
          ls -la docs/kaynak | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dala kaydet
        run: |
          git config user.name "bilgi-bankasi"
          git config user.email "actions@users.noreply.github.com"
          git add docs/kaynak
          git diff --cached --quiet || (git commit -m "Bilgi bankası: doğrulama kaynakları (metin)" && git push origin HEAD:${GITHUB_REF_NAME})
