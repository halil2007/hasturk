name: Sepete ekleme isteği tanısı

# Gerçek sitede sepete ekleme: ikas'ın kendi window.addToCart işlevi ve Ürün Bul / Bilge Bey'den ekleme (daldaki widget).
# Anonim sepet, sipariş verilmez.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/cart-api.mjs', 'scripts/cart-win.mjs', 'scripts/cart-widget.mjs', 'scripts/cart-par.mjs', '.github/workflows/cart-api.yml', 'public/pm-search.js']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: 'https://hasturkgubre.com.tr', query: 'tarım perliti' }
          - { site: 'https://tarim-dunyasi.com', query: 'perlit' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - run: node scripts/cart-par.mjs
        if: matrix.site == 'https://hasturkgubre.com.tr'
      - run: node scripts/cart-widget.mjs
        env:
          SITE_URL: ${{ matrix.site }}
          QUERY: ${{ matrix.query }}
