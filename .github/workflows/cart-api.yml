name: Sepete ekleme isteği tanısı

# Gerçek sitede sitenin kendi sepete ekleme isteği ve sayfa açmadan doğrudan ekleme denemesi. Anonim sepet, sipariş verilmez.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/cart-api.mjs', '.github/workflows/cart-api.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: 'https://hasturkgubre.com.tr', product: 'tarim-perliti', other: 'kalin-tarim-perliti' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - run: node scripts/cart-api.mjs
        env:
          SITE_URL: ${{ matrix.site }}
          PRODUCT: ${{ matrix.product }}
          OTHER: ${{ matrix.other }}
